# The installed app (Capacitor): the same web app as the GitHub Pages site, packaged for Android and iOS.
# Every run builds a debug Android APK (download it from the run's Artifacts) and compiles the iOS app.
# The card database is not bundled: the app downloads it from the Pages site.
name: Installed app (Android + iOS)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "mtgstack/**"
      - "model/**"
      - "scripts/build_pages.py"
      - ".github/workflows/app.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload the iOS app to TestFlight (needs the Apple secrets, see docs/app.md)"
        type: boolean
        default: false

permissions:
  contents: read

# An explicit bash makes a failing command fail the step even when its output is piped (to tail): without it a
# failed xcodebuild export was reported as a green run.
defaults:
  run:
    shell: bash

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -e .
          npm ci --prefix frontend
      - name: Cache Pyodide
        uses: actions/cache@v4
        with:
          path: ~/.cache/mtgstack-pyodide
          key: pyodide-0.29.5
      - name: Build the app's web assets
        run: >
          python scripts/build_pages.py --out frontend/native-www --base / --native --model model
          --data-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/"
      - uses: actions/upload-artifact@v4
        with:
          name: native-www
          path: frontend/native-www
          retention-days: 3

  android:
    name: Android (debug APK)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: native-www
          path: frontend/native-www
      - name: Sync and build
        working-directory: frontend
        run: |
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mtgstack-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: iOS (compile check)
    needs: web
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: native-www
          path: frontend/native-www
      - name: Sync and build for the simulator (no signing)
        working-directory: frontend
        run: |
          xcodebuild -version
          npm ci
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO build | tail -40

  # Manual only: Actions tab -> this workflow -> Run workflow -> tick "Upload the iOS app to TestFlight".
  # Signing is done by Xcode with an App Store Connect API key, so no certificates are stored here. docs/app.md
  # lists the three secrets and one variable this needs. NOT YET RUN: it could not be tried without an account.
  testflight:
    name: iOS (TestFlight upload)
    needs: web
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: native-www
          path: frontend/native-www
      - name: Check the Apple settings are there
        run: |
          test -n "$TEAM_ID" || { echo "::error::Set the repository variable APPLE_TEAM_ID (docs/app.md)"; exit 1; }
          test -n "$KEY_ID" -a -n "$ISSUER_ID" || { echo "::error::Set the APPSTORE_* secrets (docs/app.md)"; exit 1; }
      - name: Write the API key
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - name: Check that Apple accepts the API key
        env:
          KEY_FILE: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/check_appstore_key.py
      - name: Archive
        working-directory: frontend
        run: |
          npm ci
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -40
      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -40
