# The installed app (Capacitor): the same web app as the GitHub Pages site, packaged for Android and iOS.
# Every run builds a debug Android APK (download it from the run's Artifacts) and compiles the iOS app.
# The card database is not bundled: the app downloads it from the Pages site.
name: Installed app (Android + iOS)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "mtgstack/**"
      - "model/**"
      - "scripts/build_pages.py"
      - ".github/workflows/app.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload the iOS app to TestFlight (needs the Apple secrets, see docs/app.md)"
        type: boolean
        default: false
      certificates:
        description: "Apple signing certificates: list them, or revoke the development ones CI created (docs/app.md)"
        type: choice
        options: [none, list, revoke-ci]
        default: none

permissions:
  contents: read

# An explicit bash makes a failing command fail the step even when its output is piped (to tail): without it a
# failed xcodebuild export was reported as a green run.
defaults:
  run:
    shell: bash

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -e .
          npm ci --prefix frontend
      - name: Cache Pyodide
        uses: actions/cache@v4
        with:
          path: ~/.cache/mtgstack-pyodide
          key: pyodide-0.29.5
      - name: Build the app's web assets
        run: >
          python scripts/build_pages.py --out frontend/native-www --base / --native --model model
          --data-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/"
      - uses: actions/upload-artifact@v4
        with:
          name: native-www
          path: frontend/native-www
          retention-days: 3

  android:
    name: Android (debug APK)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: native-www
          path: frontend/native-www
      - name: Sync and build
        working-directory: frontend
        run: |
          npm ci
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mtgstack-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

  # Builds the app for the iOS simulator, runs it there and lets it tour itself (frontend/src/local/selftest.ts):
  # screenshots every few seconds and the app's log are kept as the "ios-simulator" artifact. The simulator has no
  # camera, so this covers layout, start-up, storage and the scanning engine, not the live camera.
  ios:
    name: iOS (simulator run)
    needs: web
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: native-www
          path: frontend/native-www
      - name: Build for the simulator (no signing)
        working-directory: frontend
        run: |
          xcodebuild -version
          npm ci
          echo '{"selftest": true}' > native-www/selftest.json
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -15
      - name: Run it in a simulator
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          ID=io.github.altairajit.mtgstack
          OUT="$RUNNER_TEMP/sim"; mkdir -p "$OUT"
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; ok=[x for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone') and 'SE' not in x['name']]; print(ok[0]['udid']); print(ok[0]['name'], file=sys.stderr)")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b | tail -2
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant camera "$ID" || true
          xcrun simctl launch --console-pty "$UDID" "$ID" > "$OUT/app.log" 2>&1 &
          for i in $(seq -w 1 40); do
            sleep 5
            xcrun simctl io "$UDID" screenshot "$OUT/shot-$i.png" > /dev/null 2>&1 || true
            if grep -q "SELFTEST done" "$OUT/app.log"; then sleep 3; xcrun simctl io "$UDID" screenshot "$OUT/shot-end.png" > /dev/null 2>&1 || true; break; fi
          done
          echo "---- what the app reported ----"
          grep -a "SELFTEST" "$OUT/app.log" | sed 's/.*SELFTEST //' || echo "(nothing: see app.log in the artifact)"
          grep -aq "SELFTEST done" "$OUT/app.log" || { echo "::error::The app did not finish its self-test in the simulator"; tail -30 "$OUT/app.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: ${{ runner.temp }}/sim
          retention-days: 7

  # Manual only: Actions tab -> this workflow -> Run workflow -> tick "Upload the iOS app to TestFlight".
  # Signing is done by Xcode with an App Store Connect API key, so no certificates are stored here. docs/app.md
  # lists the three secrets and one variable this needs. NOT YET RUN: it could not be tried without an account.
  testflight:
    name: iOS (TestFlight upload)
    needs: web
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: native-www
          path: frontend/native-www
      - name: Check the Apple settings are there
        run: |
          test -n "$TEAM_ID" || { echo "::error::Set the repository variable APPLE_TEAM_ID (docs/app.md)"; exit 1; }
          test -n "$KEY_ID" -a -n "$ISSUER_ID" || { echo "::error::Set the APPSTORE_* secrets (docs/app.md)"; exit 1; }
      - name: Write the API key
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - name: Check that Apple accepts the API key
        env:
          KEY_FILE: ${{ runner.temp }}/keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" scripts/check_appstore_key.py
      - name: Archive
        working-directory: frontend
        run: |
          npm ci
          npx cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive | tail -40
      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -40

  # Manual only. Every TestFlight run makes a development certificate on a fresh machine, and the account only holds a
  # few: "list" shows what is there, "revoke-ci" removes the ones CI created (scripts/appstore_certs.py).
  certificates:
    name: Apple certificates (${{ inputs.certificates }})
    if: github.event_name == 'workflow_dispatch' && inputs.certificates != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ${{ inputs.certificates }}
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          KEY_FILE: ${{ runner.temp }}/AuthKey.p8
          MODE: ${{ inputs.certificates }}
        run: |
          printf '%s' "$PRIVATE_KEY" > "$KEY_FILE"
          pip -q install pyjwt cryptography
          if [ "$MODE" = "revoke-ci" ]; then python scripts/appstore_certs.py --revoke-ci; else python scripts/appstore_certs.py; fi
