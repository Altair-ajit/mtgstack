# Phone app on GitHub Pages: everything runs in the browser; this job only builds static files.
# Runs on every push to main, daily (fresh card database + prices), and on demand (Actions tab -> Run workflow).
name: Phone app (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 10 * * *"        # daily, ~2:37am Pacific: new cards + today's prices
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          pip install -e .
          npm ci --prefix frontend

      - name: Cache Pyodide
        uses: actions/cache@v4
        with:
          path: ~/.cache/mtgstack-pyodide
          key: pyodide-0.29.5

      # The card-recognition model is trained locally (docs/scanner-model-plan.md) and committed in model/.
      - name: Build the app
        run: |
          MODEL=""
          if [ -f model/embedder.onnx ]; then MODEL="--model model"; fi
          python scripts/build_pages.py --out site --base "/${{ github.event.repository.name }}/" $MODEL

      - name: Build the card database (Scryfall bulk data + Card Kingdom prices)
        run: python -m mtgstack.cli build-catalog site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
